<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="icon" href="%sveltekit.assets%/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-icon.png" />
    <!-- Applies the stored theme before first paint so dark users never get a
         white flash. Must stay inline and blocking. -->
    <script>
      (function(){try{var t=localStorage.getItem("theme");if(t!=="dark"&&t!=="light")t="light";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}})()
    </script>
    %sveltekit.head%
  </head>
  <body class="min-h-dvh bg-bg text-text" data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
